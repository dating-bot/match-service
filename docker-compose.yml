services:
  match_server:
    build: .
    container_name: match_service
    ports:
      - "50052:50051"
    command:
      [
        "sh",
        "-c",
        "cd /app && alembic upgrade head && exec uv -q run python3 -m match_service",
      ]
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    networks:
      dating_bot_net:
        aliases:
          - match_service
    depends_on:
      match_postgres:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3

  match_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: match
      POSTGRES_PASSWORD: match
      POSTGRES_DB: match
    volumes:
      - match_pgdata:/var/lib/postgresql/data
    networks:
      - dating_bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match"]
      interval: 5s
      timeout: 3s

  match_celery:
    build: .
    container_name: match_celery
    command:
      [
        "sh",
        "-c",
        "cd /app && alembic upgrade head && exec celery -A match_service.app.celery worker --loglevel=info",
      ]
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    networks:
      - dating_bot_net
    depends_on:
      - match_postgres
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://valkey:6379/2
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}

  match_beat:
    build: .
    container_name: match_beat
    command:
      [
        "sh",
        "-c",
        "cd /app && alembic upgrade head && exec celery -A match_service.app.celery beat --loglevel=info",
      ]
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    networks:
      - dating_bot_net
    depends_on:
      - match_postgres
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://valkey:6379/2
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}

networks:
  dating_bot_net:
    external: true
    name: dating_bot_net

volumes:
  match_pgdata:
